<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#2a1b2d"/>
      <stop offset="100%" stop-color="#4a1525"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cardGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad8)"/>
  
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <circle cx="680" cy="140" r="140" fill="#f43f5e" opacity="0.18" filter="blur(40px)"/>
  <circle cx="120" cy="320" r="120" fill="#e11d48" opacity="0.12" filter="blur(40px)"/>

  <rect x="80" y="70" width="640" height="310" rx="16" fill="url(#cardGrad8)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <rect x="80" y="70" width="640" height="44" rx="16" fill="rgba(15,23,42,0.6)"/>
  <circle cx="110" cy="92" r="6" fill="#ef4444"/>
  <circle cx="130" cy="92" r="6" fill="#eab308"/>
  <circle cx="150" cy="92" r="6" fill="#22c55e"/>
  <text x="180" y="97" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CovidDashboardSL / Angular / Health API</text>

  <g transform="translate(120, 150)">
    <rect x="0" y="0" width="68" height="68" rx="16" fill="rgba(244,63,94,0.2)" stroke="rgba(244,63,94,0.4)" stroke-width="1.5"/>
    <text x="34" y="44" fill="#fb7185" font-size="34" text-anchor="middle">📊</text>

    <text x="90" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Covid Dashboard Sri Lanka</text>
    <text x="90" y="60" fill="url(#roseGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Angular &amp; Real-time Health Statistics</text>

    <text x="0" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Public health dashboard created with Angular integrating official Government APIs</text>
    <text x="0" y="138" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">to visualize live epidemiological metrics, hospital data, and national charts.</text>

    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="rgba(244,63,94,0.25)" stroke="#f43f5e" stroke-width="1"/>
      <text x="52" y="18" fill="#fecdd3" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Angular 8</text>

      <rect x="117" y="0" width="105" height="28" rx="6" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="1"/>
      <text x="169" y="18" fill="#bae6fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">TypeScript</text>

      <rect x="234" y="0" width="135" height="28" rx="6" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1"/>
      <text x="301" y="18" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Real-time APIs</text>
