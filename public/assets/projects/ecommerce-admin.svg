    <text x="0" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Comprehensive management system to handle back-office operations,</text>
    <text x="0" y="138" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">inventory reconciliation, order fulfillment pipelines, and analytics.</text>

