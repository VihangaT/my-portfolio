  <rect x="80" y="70" width="640" height="310" rx="16" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <rect x="80" y="70" width="640" height="44" rx="16" fill="rgba(15,23,42,0.6)"/>
  <circle cx="110" cy="92" r="6" fill="#ef4444"/>
