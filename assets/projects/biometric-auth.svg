      <rect x="97" y="0" width="85" height="28" rx="6" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="1"/>
      <text x="139" y="18" fill="#bae6fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">React</text>

      <rect x="194" y="0" width="130" height="28" rx="6" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1"/>
      <text x="259" y="18" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Security &amp; Auth</text>
