  <text x="180" y="97" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Department-MicroService / Java Spring Boot</text>

  <g transform="translate(120, 150)">
